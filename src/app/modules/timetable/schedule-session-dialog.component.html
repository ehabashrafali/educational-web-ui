<div class="grid w-full justify-items-center">
  <div class="flex justify-between mb-3 w-full">
    <p class="text-lg font-medium text-dark mb-1">Reschedule session</p>
  </div>
  <div class="w-full">
    <form [formGroup]="form" (ngSubmit)="save()">
      <mat-dialog-content>
        <mat-form-field class="w-full">
          <mat-label>Date</mat-label>
          <input matInput type="date" formControlName="date" required />
          <mat-error>Select a date.</mat-error>
        </mat-form-field>
        <mat-form-field class="w-full">
          <mat-label>Time</mat-label>
          <input matInput type="time" formControlName="time" required />
          <mat-error>Select a time.</mat-error>
        </mat-form-field>
        @if (error) {
          <p role="alert" class="mb-4 text-red-600">{{ error }}</p>
        }
      </mat-dialog-content>
      <mat-dialog-actions align="end">
        <button mat-button type="button" mat-dialog-close [disabled]="saving">
          Cancel
        </button>
        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="saving || form.invalid"
        >
          {{ saving ? "Saving…" : "Save schedule" }}
        </button>
      </mat-dialog-actions>
    </form>
  </div>
</div>
